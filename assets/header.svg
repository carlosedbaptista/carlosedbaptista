<svg viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" width="800" height="150" role="img" aria-label="Carlos Baptista - Data Analytics, Business Analysis, AI Integration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#7dd3c0"/>
      <stop offset="100%" stop-color="#1dd1a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="150" rx="16" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="3" rx="1.5" fill="url(#accent)" opacity="0.85">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative left bracket -->
  <rect x="60" y="55" width="4" height="40" rx="2" fill="#2d5f8a" opacity="0.4"/>
  <rect x="60" y="55" width="20" height="4" rx="2" fill="#2d5f8a" opacity="0.4"/>
  <rect x="60" y="91" width="20" height="4" rx="2" fill="#2d5f8a" opacity="0.4"/>

  <!-- Name -->
  <text x="400" y="72" font-family="ui-monospace, 'Courier New', monospace" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">Carlos Baptista</text>

  <!-- Typing cursor -->
  <rect x="624" y="44" width="3" height="32" rx="1" fill="#1dd1a1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative right bracket -->
  <rect x="736" y="55" width="4" height="40" rx="2" fill="#2d5f8a" opacity="0.4"/>
  <rect x="720" y="55" width="20" height="4" rx="2" fill="#2d5f8a" opacity="0.4"/>
  <rect x="720" y="91" width="20" height="4" rx="2" fill="#2d5f8a" opacity="0.4"/>

  <!-- Separator line -->
  <line x1="300" y1="92" x2="500" y2="92" stroke="#2d5f8a" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Subtitle -->
  <text x="400" y="116" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#94a3b8" text-anchor="middle">Data Analytics &#8226; Business Analysis &#8226; AI Integration</text>

  <!-- Status dots -->
  <circle cx="318" cy="136" r="4" fill="#ff6b6b">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="338" cy="136" r="4" fill="#feca57">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="358" cy="136" r="4" fill="#1dd1a1">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="412" y="140" font-family="ui-monospace, 'Courier New', monospace" font-size="11" fill="#64748b" text-anchor="middle">Wallisellen, Zurich &#8226; Open to Opportunities</text>
</svg>
