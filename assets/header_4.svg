<svg viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg" width="800" height="180" role="img" aria-label="Carlos Baptista - Data Analytics, Business Analysis, AI Integration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#7dd3c0"/>
      <stop offset="100%" stop-color="#1dd1a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="180" rx="16" fill="url(#bg)"/>

  <rect x="0" y="0" width="800" height="3" rx="1.5" fill="url(#accent)" opacity="0.85">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <rect x="70" y="55" width="4" height="40" rx="2" fill="#2d5f8a" opacity="0.4"/>
  <rect x="70" y="55" width="20" height="4" rx="2" fill="#2d5f8a" opacity="0.4"/>
  <rect x="70" y="91" width="20" height="4" rx="2" fill="#2d5f8a" opacity="0.4"/>

  <rect x="726" y="55" width="4" height="40" rx="2" fill="#2d5f8a" opacity="0.4"/>
  <rect x="710" y="55" width="20" height="4" rx="2" fill="#2d5f8a" opacity="0.4"/>
  <rect x="710" y="91" width="20" height="4" rx="2" fill="#2d5f8a" opacity="0.4"/>

  <text x="390" y="85" font-family="ui-monospace, 'Courier New', monospace" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">Carlos Baptista</text>

  <rect x="610" y="59" width="3" height="30" rx="1" fill="#1dd1a1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <line x1="310" y1="105" x2="490" y2="105" stroke="#2d5f8a" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <text x="400" y="130" font-family="ui-monospace, 'Courier New', monospace" font-size="15" fill="#94a3b8" text-anchor="middle">Data Analytics &#8226; Business Analysis &#8226; AI Integration</text>

  <circle cx="370" cy="151" r="4" fill="#ff6b6b">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="151" r="4" fill="#feca57">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="151" r="4" fill="#1dd1a1">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
